<div class="w-full flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 h-full overflow-hidden">
  
  <!-- Left Sidebar (1/3 width on large screens, full on smaller) -->
  <aside class="lg:col-span-1 flex flex-col h-full bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
    
    <!-- Sidebar Header: Search & Refresh -->
    <div class="p-4 border-b border-gray-100 bg-gray-50/50 space-y-3">
      <div class="flex items-center space-x-2">
        <!-- Search Input Wrapper -->
        <div class="relative flex-1">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </span>
          <input 
            type="text" 
            [ngModel]="searchQuery()" 
            (ngModelChange)="onSearchChange($event)"
            class="w-full pl-9 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm"
            placeholder="Search name, email, role..."
          />
        </div>

        <!-- Refresh Button -->
        <button 
          (click)="onRefresh()" 
          class="p-2.5 bg-white border border-gray-200 text-gray-500 hover:text-blue-600 hover:border-blue-200 rounded-xl transition-all duration-200 shadow-sm hover:shadow active:scale-95 flex items-center justify-center flex-shrink-0"
          title="Refresh Directory"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
          </svg>
        </button>
      </div>

      <!-- Result Counter -->
      <div class="flex justify-between items-center text-xs text-gray-500 font-medium px-1">
        <span>Showing {{ filteredCount() }} {{ filteredCount() === 1 ? 'member' : 'members' }}</span>
        <span *ngIf="searchQuery()" class="text-blue-600 font-semibold bg-blue-50 px-2 py-0.5 rounded-full">Filtered</span>
      </div>
    </div>

    <!-- Scrollable Cards List -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/20">
      <ng-container *ngIf="filteredCount() > 0; else emptyState">
        <app-user-card 
          *ngFor="let user of filteredUsers()" 
          [user]="user" 
          [isActive]="selectedUser()?.id === user.id"
          (selectUser)="onSelectUser($event)" 
          (deleteUser)="onDeleteUser($event)"
          class="block"
        ></app-user-card>
      </ng-container>

      <ng-template #emptyState>
        <div class="flex flex-col items-center justify-center text-center p-8 py-16">
          <div class="p-3 bg-gray-100 rounded-full mb-3 text-gray-400">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <p class="text-sm font-semibold text-gray-700">No members found</p>
          <p class="text-xs text-gray-400 mt-1 max-w-[200px]">No results match your query. Try typing something else or click refresh.</p>
        </div>
      </ng-template>
    </div>
  </aside>

  <!-- Right Side (2/3 width on LG) -> Detail Panel -->
  <section class="lg:col-span-2 flex flex-col h-full min-h-[400px]">
    <app-user-detail 
      [user]="selectedUser()" 
      (toggleFavorite)="onToggleFavorite($event)"
      (clearSelection)="onClearSelection()"
      class="h-full block"
    ></app-user-detail>
  </section>
</div>
