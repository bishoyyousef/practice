<div class="max-w-xl mx-auto w-full bg-white border border-gray-200 rounded-2xl p-6 md:p-8 shadow-sm">
  <!-- Header -->
  <div class="flex items-center space-x-3 mb-6">
    <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
      </svg>
    </div>
    <div>
      <h2 class="text-xl font-bold text-gray-900">Add New Team Member</h2>
      <p class="text-xs text-gray-500 mt-0.5">Introduce a new team member to your shared workspace.</p>
    </div>
  </div>

  <!-- Form -->
  <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)" novalidate class="space-y-5">
    
    <!-- Name Field -->
    <div>
      <label for="name" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Full Name</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        #nameInput="ngModel"
        [(ngModel)]="userModel.name" 
        required
        class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm"
        [class.border-red-300]="nameInput.invalid && (nameInput.dirty || nameInput.touched || userForm.submitted)"
        placeholder="e.g. John Doe"
      />
      <div *ngIf="nameInput.invalid && (nameInput.dirty || nameInput.touched || userForm.submitted)" class="text-xs text-red-500 mt-1 font-medium">
        Full Name is required.
      </div>
    </div>

    <!-- Email Field -->
    <div>
      <label for="email" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Email Address</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        #emailInput="ngModel"
        [(ngModel)]="userModel.email" 
        required
        email
        class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm"
        [class.border-red-300]="emailInput.invalid && (emailInput.dirty || emailInput.touched || userForm.submitted)"
        placeholder="e.g. john@company.com"
      />
      <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched || userForm.submitted)" class="text-xs text-red-500 mt-1 font-medium">
        <span *ngIf="emailInput.errors?.['required']">Email is required.</span>
        <span *ngIf="emailInput.errors?.['email']">Please enter a valid email address.</span>
      </div>
    </div>

    <!-- Grid row for Role & Status -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Role -->
      <div>
        <label for="role" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Role</label>
        <select 
          id="role" 
          name="role" 
          [(ngModel)]="userModel.role"
          class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm appearance-none"
        >
          <option value="admin">Admin</option>
          <option value="user">User</option>
          <option value="editor">Editor</option>
          <option value="viewer">Viewer</option>
        </select>
      </div>

      <!-- Status -->
      <div>
        <label for="status" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Initial Status</label>
        <select 
          id="status" 
          name="status" 
          [(ngModel)]="userModel.status"
          class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm appearance-none"
        >
          <option value="online">Online</option>
          <option value="away">Away</option>
          <option value="offline">Offline</option>
        </select>
      </div>
    </div>

    <!-- Bio Textarea -->
    <div>
      <label for="bio" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Biography</label>
      <textarea 
        id="bio" 
        name="bio" 
        [(ngModel)]="userModel.bio"
        rows="3"
        class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm"
        placeholder="Short description of skills, responsibilities, or interests..."
      ></textarea>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end space-x-3 pt-3 border-t border-gray-100">
      <a 
        routerLink="/users" 
        class="px-4 py-2.5 border border-gray-200 hover:bg-gray-50 text-gray-700 rounded-xl text-sm font-medium transition-colors shadow-sm text-center"
      >
        Cancel
      </a>
      <button 
        type="submit"
        [disabled]="userForm.invalid"
        class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 disabled:cursor-not-allowed text-white rounded-xl text-sm font-semibold shadow-sm hover:shadow transition-all"
      >
        Save Member
      </button>
    </div>

  </form>
</div>
