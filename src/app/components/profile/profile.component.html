<div class="max-w-xl mx-auto w-full bg-white border border-gray-200 rounded-3xl p-6 md:p-8 shadow-sm">

  <!-- Success Banner -->
  <div *ngIf="showSuccess()"
    class="bg-green-50 border border-green-200 text-green-800 p-4 rounded-2xl text-sm font-semibold flex items-center mb-6 animate-fade-in">
    <svg class="h-5 w-5 text-green-600 mr-2 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>Profile settings saved successfully!</span>
  </div>

  <!-- Header -->
  <div class="flex items-center mb-6">
    <div>
      <h2 class="text-xl font-bold text-gray-900">Manage Profile</h2>
    </div>
  </div>

  <!-- Reactive Form -->
  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" novalidate class="space-y-5">

    <!-- Name Field -->
    <div>
      <label for="name" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
        Name
      </label>
      <input type="text" id="name" formControlName="name"
        class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm"
        [class.border-red-300]="profileForm.get('name')?.invalid && (profileForm.get('name')?.dirty || profileForm.get('name')?.touched)"
        placeholder="Enter your name" />
      <div
        *ngIf="profileForm.get('name')?.invalid && (profileForm.get('name')?.dirty || profileForm.get('name')?.touched)"
        class="text-xs text-red-500 mt-1 font-medium">
        Name is required.
      </div>
    </div>

    <!-- Biography Field -->
    <div>
      <label for="bio" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Bio</label>
      <textarea id="bio" formControlName="bio" rows="3"
        class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm"
        placeholder="Introduce yourself to the team..."></textarea>
    </div>

    <!-- Skills Dynamic FormArray Section -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Skills</label>

        <!-- Add Skill Control -->
        <button type="button" (click)="addSkill()"
          class="text-xs text-blue-600 hover:text-blue-700 font-bold flex items-center space-x-0.5 hover:underline">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
          <span>Add Skill</span>
        </button>
      </div>

      <!-- FormArray Controls Loop -->
      <div formArrayName="skills" class="space-y-2">
        <div *ngFor="let skillCtrl of skills.controls; let i = index"
          class="flex items-center space-x-2 animate-slide-in">
          <input type="text" [formControlName]="i"
            class="flex-1 px-4 py-2 bg-white border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors shadow-sm"
            [class.border-red-300]="skillCtrl.invalid && (skillCtrl.dirty || skillCtrl.touched)"
            placeholder="e.g. Angular, Typescript, CSS" />

          <!-- Delete Row Button -->
          <button type="button" (click)="removeSkill(i)"
            class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all flex items-center justify-center border border-transparent hover:border-red-100 flex-shrink-0"
            title="Remove Skill">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Empty State in FormArray -->
        <div *ngIf="skills.length === 0"
          class="text-xs text-gray-400 italic bg-gray-50/50 p-4 rounded-xl border border-dashed border-gray-200 text-center">
          No skills added yet. Click "+ Add Skill" to start cataloging your expertise.
        </div>
      </div>
    </div>

    <!-- Submit Action -->
    <div class="flex items-center justify-end pt-4 border-t border-gray-100">
      <button type="submit" [disabled]="profileForm.invalid"
        class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 disabled:cursor-not-allowed text-white rounded-xl text-sm font-semibold shadow-sm hover:shadow transition-all">
        Save Changes
      </button>
    </div>

  </form>
</div>
