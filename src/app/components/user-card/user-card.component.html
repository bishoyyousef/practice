<div
  (click)="onSelect()"
  class="relative flex items-center p-4 border rounded-xl cursor-pointer transition-all duration-200 group"
  [ngClass]="{
    'border-blue-500 bg-blue-50/50 shadow-sm': isActive,
    'border-gray-200 hover:bg-gray-50 hover:border-gray-300 hover:shadow-sm bg-white': !isActive
  }"
>
  <!-- Delete Button -->
  <button
    (click)="onDelete($event)"
    class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition-colors p-1 rounded-full hover:bg-red-50 opacity-0 group-hover:opacity-100 focus:opacity-100"
    aria-label="Delete user"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Avatar & Status -->
  <div class="relative flex-shrink-0 mr-4">
    <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" [alt]="user.name" class="w-12 h-12 rounded-full object-cover border border-gray-100" />
    <div *ngIf="!user.avatarUrl" class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 font-extrabold text-sm flex items-center justify-center border border-blue-100 uppercase select-none">
      {{ user.name.slice(0, 2) }}
    </div>
    <span
      class="absolute bottom-0 right-0 block w-3 h-3 rounded-full border-2 border-white"
      [ngClass]="{
        'bg-green-500': user.status === 'online',
        'bg-yellow-400': user.status === 'away',
        'bg-gray-400': user.status === 'offline'
      }"
    ></span>
  </div>

  <!-- Info -->
  <div class="flex-1 min-w-0">
    <div class="flex items-center justify-between mb-0.5">
      <h3 class="text-sm font-semibold text-gray-900 truncate pr-6">{{ user.name }}</h3>
    </div>
    <div class="flex items-center space-x-2 text-xs text-gray-500 mb-1">
      <span class="truncate">{{ user.email }}</span>
      <span *ngIf="user.role" class="w-1 h-1 rounded-full bg-gray-300 flex-shrink-0"></span>
      <span *ngIf="user.role"
        class="px-2 py-0.5 rounded-full font-medium text-[10px] uppercase tracking-wider"
        [ngClass]="{
          'bg-purple-100 text-purple-700': user.role === 'admin',
          'bg-blue-100 text-blue-700': user.role === 'editor',
          'bg-green-100 text-green-700': user.role === 'user',
          'bg-gray-100 text-gray-700': user.role === 'viewer'
        }"
      >
        {{ user.role }}
      </span>
    </div>
    <p *ngIf="user.bio" class="text-xs text-gray-600">
      {{ user.bio | truncate:50:'...' }}
    </p>
  </div>
</div>
