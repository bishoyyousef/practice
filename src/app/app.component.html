<div class="app-layout min-h-screen flex flex-col bg-slate-50/50">

  <!-- Modern Top Navigation Header -->
  <header
    class="app-header bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between sticky top-0 z-40 shadow-sm/5">
    <div routerLink="/users" class="flex items-center cursor-pointer hover:opacity-90 transition-opacity">
      <h1 class="header-title font-extrabold text-lg text-gray-900 tracking-tight">Team Directory</h1>
    </div>

    <!-- Navigation Options -->
    <div class="flex items-center space-x-2">
      <!-- Authenticated Links -->
      <ng-container *ngIf="isLoggedIn()">
        <a routerLink="/users" [appHighlight]="'/users'"
          class="px-3.5 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100/50 transition-all flex items-center active:scale-95 ml-1">
          <span>View Directory</span>
        </a>
        <a routerLink="/profile" [appHighlight]="'/profile'"
          class="px-3.5 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100/50 transition-all flex items-center active:scale-95 ml-1">
          <span>Manage Profile</span>
        </a>
        <button routerLink="/users/new" [appHighlight]="'/users/new'"
          class="px-3.5 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100/50 transition-all flex items-center active:scale-95 ml-1">
          <span>Add user</span>
        </button>
        <button (click)="logout()"
          class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-bold shadow-sm transition-all active:scale-95 ml-2">
          Sign Out
        </button>
      </ng-container>

      <!-- Guest Links -->
      <ng-container *ngIf="!isLoggedIn()">
        <a routerLink="/login" [appHighlight]="'/login'"
          class="px-3.5 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100/50 transition-all">
          Sign In
        </a>
        <a routerLink="/register" [appHighlight]="'/register'"
          class="px-3.5 py-2 rounded-xl text-sm font-semibold text-gray-600 hover:text-gray-900 hover:bg-gray-100/50 transition-all">
          Register
        </a>
      </ng-container>
    </div>
  </header>

  <!-- Router Outlet for Child Views -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 overflow-hidden flex flex-col relative">
    <router-outlet></router-outlet>
  </main>
</div>
