<div class="app-layout">
  <!-- Top Navigation -->
  <header class="app-header">
    <div class="header-brand">
      <h1 class="header-title">Team Directory</h1>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="app-main">

    <!-- Left Sidebar (1/3 width) -->
    <aside class="app-sidebar">
      <!-- Search Header -->
      <div class="search-header">
        <div class="search-input-wrapper">
          <div class="search-icon-wrapper">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
              fill="currentColor">
              <path fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <input type="text" [ngModel]="searchQuery()" (ngModelChange)="onSearchChange($event)" autofocus
            class="search-input"
            placeholder="Search team members...">
        </div>

        <div class="search-counter">
          Showing {{ filteredCount() }} {{ filteredCount() === 1 ? 'user' : 'users' }}
        </div>
      </div>

      <!-- User List -->
      <div class="user-list">
        <ng-container *ngIf="filteredCount() > 0; else emptyState">
          <app-user-card *ngFor="let user of filteredUsers()" [user]="user" [isActive]="selectedUser()?.id === user.id"
            (selectUser)="onSelectUser($event)" (deleteUser)="onDeleteUser($event)"></app-user-card>
        </ng-container>

        <ng-template #emptyState>
          <div class="empty-state-container">
            <svg class="empty-state-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <p class="empty-state-text">No team members match your search</p>
            <p class="empty-state-subtext">Try adjusting your filters or search query.</p>
          </div>
        </ng-template>
      </div>
    </aside>

    <!-- Right Detail Panel (2/3 width) -->
    <section class="app-detail-panel">
      <app-user-detail [user]="selectedUser()" (toggleFavorite)="onToggleFavorite($event)"
        (clearSelection)="onClearSelection()"></app-user-detail>
    </section>

  </main>
</div>
